<div class="container mt-4">
  <h4 class="mb-4">Soldes des caisses</h4>

  <!-- Chargement -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
    <p class="mt-2">Chargement des soldes...</p>
  </div>

  <!-- Section des caisses défilables -->
  <div *ngIf="!loading && caisseAllSolde.length > 0" class="caisses-scroll-container">
    <div class="caisses-scroll">
      <div *ngFor="let caisse of caisseAllSolde" class="caisse-card">
        <div class="card-icon">
          <i class="ri-bank-line"></i>
        </div>
        <div class="card-body">
          <span class="card-code">{{ caisse.codecaisse }}</span>
          <h5 class="card-title">{{ caisse.libelle }}</h5>
          <p class="card-solde">
            <span>Solde :</span>
            <strong>{{ getSolde(caisse) | number:'1.0-0' }} {{ caisse.codedevise }}</strong>
          </p>
          <p class="card-date">
            Dernière période : {{ caisse.derniere_date_periode | date:'dd/MM/yyyy' }}
          </p>
        </div>
        <div class="card-progress">
          <div class="progress-fill" style="width: 75%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Aucune caisse -->
  <div *ngIf="!loading && caisseAllSolde.length === 0" class="alert alert-info text-center">
    Aucune caisse trouvée pour afficher le solde.
  </div>
</div>
