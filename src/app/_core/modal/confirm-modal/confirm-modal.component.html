<div class="modal-header">
  <h5 class="modal-title">{{ title }}</h5>

  <button
    type="button"
    class="btn-close"
    (click)="cancel()">
  </button>
</div>

<div class="modal-body">
  {{ message }}
</div>

<div class="modal-footer">
  <button
    class="btn btn-secondary"
    (click)="cancel()">
    Annuler
  </button>

  <button
    class="btn btn-danger"
    (click)="confirm()">
    Confirmer
  </button>
</div>
