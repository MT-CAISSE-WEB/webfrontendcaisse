 <form [formGroup]="circuitvalidateurForm" (ngSubmit)="onsubmit()">
                                <div class="row">
                                    <div class="col-sm-4 mb-3">
                                        <label class="form-label">Code Validateur </label>
                                        <input type="text" formControlName="codecircuitvalidateur" 
                                        class="form-control form-control-sm">  
                                    </div>

                                    <div class="col-sm-4 mb-3">
                                        <label class="form-label"> Circuit de validation </label>
                                        <select class="form-select form-select-sm" id="" formControlName="idcircuitvalidation">
                                            <option value="">---- Choix du circuit de validation ----</option>
                                            <option *ngFor="let c of circuitvalidations" [value]="c.idcircuitvalidation">{{ c.codecircuitvalidation}}</option>
                                        </select>
                                    </div>
                                    
                                     <div class="col-sm-4 mb-3">
                                        <label class="form-label">Utilisateur </label>
                                        <select class="form-select form-select-sm" id="" formControlName="idutilisateur">
                                            <option value="">---- Choix de l'utilisateur ----</option>
                                            <option *ngFor="let u of utilisateurs" [value]="u.idutilisateur">{{ u.prenom }} {{ u.nom }}</option>
                                        </select>
                                    </div>

                                    <div class="row">
                                    <div class="col-sm-2 mb-3">
                                        <label class="form-label"> Rang de validation </label>
                                        <input type="number" class="form-control form-control-sm" formControlName="rangvalidation">
                                    </div>    
                                </div>

                                    
                                </div>  
                                
                                <div class="row">
                                    <div class="col-md-6 d-flex gap-2">
    
                                        <button type="submit" class="btn btn-sm btn-soft-primary w-100">
                                        {{ actionModal === 'create' ? 'Enregistrer' :
                                            actionModal === 'update' ? 'Modifier' :
                                            'Dupliquer'
                                        }}
                                        </button>

                                        <button class="btn btn-sm btn-dark w-100" (click)="modalCreate()">
                                        Réinitialiser
                                        </button>

                                    </div>
                                </div>


</form>
