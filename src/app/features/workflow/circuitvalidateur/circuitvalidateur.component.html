<div class="glass-card">
  <div class="glass-card-header">
    <div class="d-flex align-items-center gap-2">
      <i class="ri-shield-user-line fs-5 text-primary"></i>
      <h5 class="mb-0">Configuration du validateur</h5>
    </div>
  </div>

  <div class="glass-card-body">
    <form [formGroup]="circuitvalidateurForm" (ngSubmit)="onsubmit()">
      <!-- Ligne 1 : Code Validateur -->
      <div class="form-row">
        <div class="input-group-glass">
          <i class="ri-barcode-line"></i>
          <input
            type="text"
            formControlName="codecircuitvalidateur"
            placeholder="Code validateur"
          />
          <label>Code validateur</label>
        </div>
      </div>

      <!-- Ligne 2 : Circuit de validation -->
      <div class="form-row">
        <div class="input-group-glass">
          <i class="ri-shield-line"></i>
          <select formControlName="idcircuitvalidation">
            <option value="">-- Choix du circuit de validation --</option>
            <option
              *ngFor="let c of circuitvalidations"
              [value]="c.idcircuitvalidation"
            >
              {{ c.codecircuitvalidation }}
            </option>
          </select>
          <label>Circuit de validation</label>
        </div>
      </div>

      <!-- Ligne 3 : Utilisateur -->
      <div class="form-row">
        <div class="input-group-glass">
          <i class="ri-user-line"></i>
          <select formControlName="idutilisateur">
            <option value="">-- Choix de l'utilisateur --</option>
            <option *ngFor="let u of utilisateurs" [value]="u.idutilisateur">
              {{ u.prenom }} {{ u.nom }}
            </option>
          </select>
          <label>Utilisateur</label>
        </div>
      </div>

      <!-- Ligne 4 : Rang de validation -->
      <div class="form-row">
        <div class="input-group-glass">
          <i class="ri-sort-number-line"></i>
          <input
            type="number"
            formControlName="rangvalidation"
            placeholder="Rang de validation"
          />
          <label>Rang de validation</label>
        </div>
      </div>

      <!-- Boutons d'action -->
      <div class="form-actions">
        <button type="submit" class="btn-glass-primary" [disabled]="loading">
          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm me-2"
          ></span>
          <i *ngIf="!loading" class="ri-save-line me-2"></i>
          {{
            actionModal === "create"
              ? "Enregistrer"
              : actionModal === "update"
                ? "Modifier"
                : "Dupliquer"
          }}
        </button>
        <button
          type="button"
          class="btn-glass-secondary"
          (click)="modalCreate()"
        >
          <i class="ri-refresh-line me-2"></i>
          Réinitialiser
        </button>
      </div>
    </form>
  </div>
</div>
