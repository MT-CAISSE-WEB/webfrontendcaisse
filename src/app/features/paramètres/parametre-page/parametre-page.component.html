<div class="row">
  <div class="col-12">
    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
      <h4 class="mb-sm-0">{{ title }}</h4>
      <div class="page-title-right">
        <ol class="breadcrumb m-0">
          <li class="breadcrumb-item"><a href="javascript: void(0);">Paramètres</a></li>
          <li class="breadcrumb-item active">{{ title }}</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-xxl-9">
    <div class="card mt-xxl-n5">
      <div class="card-header">
        <ul class="nav nav-tabs-custom rounded card-header-tabs border-bottom-0" role="tablist">
          <li class="nav-item">
            <a class="nav-link" [class.active]="activeTab === 'general'" (click)="setActiveTab('general')" role="tab">
              <i class="fas fa-home"></i> Paramètres diverses
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" [class.active]="activeTab === 'notifications'" (click)="setActiveTab('notifications')" role="tab">
              <i class="far fa-envelope"></i> Notifications
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" [class.active]="activeTab === 'accounting'" (click)="setActiveTab('accounting')" role="tab">
              <i class="far fa-envelope"></i> Configuration comptable
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" [class.active]="activeTab === 'counter'" (click)="setActiveTab('counter')" role="tab">
              <i class="far fa-envelope"></i> Compteur
            </a>
          </li>
        </ul>
      </div>
      <div class="card-body p-4">
        <div class="tab-content">
          <div class="tab-pane" [class.active]="activeTab === 'general'" role="tabpanel">
            <app-parametre-diverse></app-parametre-diverse>
          </div>
          <div class="tab-pane" [class.active]="activeTab === 'notifications'" role="tabpanel">
            <app-motif></app-motif>
          </div>
          <div class="tab-pane" [class.active]="activeTab === 'accounting'" role="tabpanel">
            <app-config-comptable></app-config-comptable>
          </div>
          <div class="tab-pane" [class.active]="activeTab === 'counter'" role="tabpanel">
            <app-compteur></app-compteur>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
