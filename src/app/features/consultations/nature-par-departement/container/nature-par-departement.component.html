<div class="row">
  <div class="col-xl-12">
    <div class="card card-height">
      <div class="card-header align-items-center d-flex">
        <h4 class="card-title mb-0 flex-grow-1">{{ title }}</h4>
        <div class="flex-shrink-0 ms-2">
          <div class="dropdown card-header-dropdown">
            <a
              class="btn btn-soft-primary btn-sm"
              role="button"
              href="#"
              data-bs-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false"
            >
              Obtenir rapport<i
                class="mdi mdi-chevron-down align-middle ms-1"
              ></i>
            </a>
            <div class="dropdown-menu dropdown-menu-end">
              <a class="dropdown-item" href="#">Télécharger rapport</a>
              <a class="dropdown-item" href="#">Exporter vers excel</a>
            </div>
          </div>
        </div>
      </div>
      <!-- end card header -->
      <div class="card-body">
        <div class="row">
          <!-- Demandes par nature -->
          <app-nature-per-dept-chart
            [idsociete]="user.idsociete"
            [idsite]="idsite"
          ></app-nature-per-dept-chart>
        </div>
        <div class="row align-items-center">
          <div class="col-md-6">
            <!-- Demande par statut -->
            <app-demandes-by-status-chart
              [idsociete]="user.idsociete"
              [idsite]="idsite"
            ></app-demandes-by-status-chart>
          </div>
          <div class="col-md-6">
            <app-montant-per-dept-chart
              [idsociete]="user.idsociete"
              [idsite]="idsite"
            ></app-montant-per-dept-chart>
          </div>
        </div>
        <div class="row" style="margin-top: 50px">
          <div class="col-md-6">
            <app-stats-budget-annuel-chart
              [idsociete]="user.idsociete"
              [idsite]="idsite"
            ></app-stats-budget-annuel-chart>
          </div>
          <div class="col-md-6">
            <app-stats-budget-mensuel-chart
              [idsociete]="user.idsociete"
              [idsite]="idsite"
            ></app-stats-budget-mensuel-chart>
          </div>
        </div>
        <div class="row mt-5">
          <app-mouvement-caisse-chart
            [idsociete]="user.idsociete"
            [idsite]="idsite"
          ></app-mouvement-caisse-chart>
        </div>
        <div class="row" style="margin-top: 50px">
          <app-top-nature-chart
            [idsociete]="user.idsociete"
            [idsite]="idsite"
          ></app-top-nature-chart>
        </div>
        <div class="row" style="margin-top: 50px">
          <app-top-centre-chart
            [idsociete]="user.idsociete"
            [idsite]="idsite"
          ></app-top-centre-chart>
        </div>
        <div class="row" style="margin-top: 50px">
          <div class="col-md-6">
            <app-top-montant-nature-chart
              [idsociete]="user.idsociete"
              [idsite]="idsite"
            ></app-top-montant-nature-chart>
          </div>
          <div class="col-md-6">
            <app-top-montant-centre-chart
              [idsociete]="user.idsociete"
              [idsite]="idsite"
            ></app-top-montant-centre-chart>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
