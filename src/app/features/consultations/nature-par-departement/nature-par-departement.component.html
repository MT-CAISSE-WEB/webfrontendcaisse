<div class="row">
  <div class="col-xl-12">
    <div class="card card-height">
      <div class="card-header align-items-center d-flex">
        <h4 class="card-title mb-0 flex-grow-1">{{ title }}</h4>
        <div class="flex-shrink-0 ms-2">
          <div class="dropdown card-header-dropdown">
            <a
              class="btn btn-soft-primary btn-sm"
              role="button"
              href="#"
              data-bs-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false"
            >
              Obtenir rapport<i
                class="mdi mdi-chevron-down align-middle ms-1"
              ></i>
            </a>
            <div class="dropdown-menu dropdown-menu-end">
              <a class="dropdown-item" href="#">Télécharger rapport</a>
              <a class="dropdown-item" href="#">Exporter vers excel</a>
            </div>
          </div>
        </div>
      </div>
      <!-- end card header -->
      <div class="card-body">
        <div class="row">
          <div echarts [options]="options"></div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <div
              echarts
              [options]="chartDmdByStatusOption"
              style="height: 400px"
            ></div>
          </div>
          <div class="col-md-6">
            <div
              echarts
              [options]="chartmontantbyDept"
              style="height: 400px"
            ></div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <div
              echarts
              [options]="chartBudgetAnnuel"
              style="height: 400px"
            ></div>
          </div>
          <div class="col-md-6">
            <div
              echarts
              [options]="chartBudgetMensuel"
              style="height: 400px"
            ></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
