<div class="auth-wrapper">
  <!-- Background animé -->
  <div class="auth-bg">
    <div class="bg-gradient"></div>
    <div class="animated-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
    </div>
  </div>

  <!-- Carte de connexion -->
  <div class="auth-container">
    <div class="auth-card glass-card">
      <!-- Logo et titre -->
      <div class="auth-header">
        <div class="logo-wrapper">
          <div class="logo-icon">
            <i class="ri-calculator-line"></i>
          </div>
          <h2 class="logo-text">MT CAISSE<span>WEB</span></h2>
        </div>
        <div class="welcome-text">
          <h3>Connexion</h3>
        </div>
      </div>

      <!-- Formulaire -->
      <form [formGroup]="form" (ngSubmit)="login()" class="auth-form">
        <!-- Champ identifiant -->
        <div class="input-group-modern">
          <div class="input-icon">
            <i class="ri-user-3-line"></i>
          </div>
          <input
            type="text"
            class="input-modern app-sm"
            formControlName="login"
            placeholder="Identifiant"
            autocomplete="off"
          />
          <div class="input-border"></div>
        </div>

        <!-- Champ mot de passe -->
        <div class="input-group-modern">
          <div class="input-icon">
            <i class="ri-lock-line"></i>
          </div>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="input-modern app-sm"
            formControlName="password"
            placeholder="Mot de passe"
            autocomplete="off"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
          >
            <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
          </button>
          <div class="input-border"></div>
        </div>

        <!-- Message d'erreur -->
        <div *ngIf="errormsg" class="error-message">
          <i class="ri-error-warning-line"></i>
          <span>{{ errormsg }}</span>
        </div>

        <!-- Bouton de connexion -->
        <button type="submit" class="btn-login" [disabled]="loading">
          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm me-2"
          ></span>
          <i *ngIf="!loading" class="ri-login-circle-line me-2"></i>
          {{ loading ? "Connexion en cours..." : "Se connecter" }}
        </button>

        <!-- Lien supplémentaire -->
        <div class="auth-footer">
          <a href="#" class="forgot-link">Mot de passe oublié ?</a>
        </div>
      </form>

      <!-- Footer -->
      <div class="auth-copyright">
        <p>© 2025 MTI - Tous droits réservés</p>
        <p class="small">Développé par <span>Saint Père</span></p>
      </div>
    </div>
  </div>
</div>
